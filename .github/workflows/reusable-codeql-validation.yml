name: Reusable - CodeQL Validation

on:
  workflow_call:
    secrets:
      SIXLABORS_LICENSE_KEY:
        required: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Six Labors license
        shell: bash
        run: |
          if [ -z "$SIXLABORS_LICENSE_KEY" ]; then
            echo "SIXLABORS_LICENSE_KEY is missing."
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
