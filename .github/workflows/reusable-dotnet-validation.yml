name: Reusable - .NET Validation

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file to validate
        required: false
        type: string
        default: WeatherPix.slnx

permissions:
  contents: read

jobs:
  validate:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore and audit dependencies
        run: dotnet restore "${{ inputs.solution }}"

      - name: Verify formatting
        run: >
          dotnet format "${{ inputs.solution }}"
          --verify-no-changes
          --no-restore

      - name: Build
        run: >
          dotnet build "${{ inputs.solution }}"
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test "${{ inputs.solution }}"
          --configuration Release
          --no-build
          --verbosity normal