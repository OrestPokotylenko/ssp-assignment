name: Reusable - .NET Validation

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file to validate
        required: false
        type: string
        default: WeatherPix.slnx

    secrets:
      SIXLABORS_LICENSE_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Validate Six Labors license
        shell: bash
        run: |
          if [ -z "$SIXLABORS_LICENSE_KEY" ]; then
            echo "SIXLABORS_LICENSE_KEY is missing."
            exit 1
          fi

      - name: Restore and audit dependencies
        run: dotnet restore "${{ inputs.solution }}"

      - name: Verify formatting
        run: >
          dotnet format "${{ inputs.solution }}"
          --verify-no-changes
          --no-restore

      - name: Build
        run: >
          dotnet build "${{ inputs.solution }}"
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test "${{ inputs.solution }}"
          --configuration Release
          --no-build
          --verbosity normal
