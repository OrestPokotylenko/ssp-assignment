name: Branch Policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Main Source Branch
    runs-on: ubuntu-latest

    env:
      HEAD_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Require develop as source
        run: |
          if [ "$HEAD_BRANCH" != "develop" ]; then
            echo "::error::Pull requests to main must originate from develop."
            exit 1
          fi

          echo "Source branch is valid: develop"
