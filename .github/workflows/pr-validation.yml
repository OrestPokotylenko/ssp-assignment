name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Quality
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/reusable-dotnet-validation.yml
    with:
      solution: WeatherPix.slnx

  security:
    name: Repository Security
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/reusable-security-validation.yml

  infrastructure:
    name: Infrastructure
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/reusable-iac-validation.yml
    with:
      bicep-file: infra/main.bicep

  codeql:
    name: CodeQL
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql-validation.yml